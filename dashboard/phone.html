<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e" id="theme">
<link rel="manifest" href="/manifest.json">
<title>Fall Alert</title>
<style>
:root{--red:#b3261e;--red-d:#8f1d17;--green:#1d5c4c;--ink:#16302a;--mut:#6b7a74;--bg:#f4f4f1;--amber:#c27c0e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:130px}
.hdr{background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 20px}
.hdr.red{background:var(--red)}
.hdr .l1{display:flex;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.05em}
.hdr h1{margin:10px 0 4px;font-size:30px;line-height:1.1}
.hdr p{margin:0;opacity:.9;font-size:15px}
.wrap{padding:14px}
.video{position:relative;background:#1d2a27;border-radius:22px;overflow:hidden;aspect-ratio:4/3}
.video img{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.pill{position:absolute;top:12px;background:rgba(0,0,0,.7);color:#fff;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.pill.live{left:12px}.pill.live:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4b3e;margin-right:6px}
.pill.live.off:before{background:#999}.pill.clk{right:12px}
.tag{position:absolute;left:12px;bottom:12px;background:#f6b83d;color:#3b2800;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:800;display:none}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;color:#9fb1ab;font-size:14px;pointer-events:none;text-align:center;padding:10px}
.voice{display:none;background:var(--green);color:#fff;border-radius:99px;padding:13px 18px;margin-top:12px;font-size:15px}
.card{background:#fff;border-radius:22px;padding:16px 18px;margin-top:12px}
.card small{display:block;color:var(--mut);font-weight:800;letter-spacing:.05em;font-size:12px;margin-bottom:8px}
.upd{display:grid;grid-template-columns:62px 14px 1fr;gap:10px;padding:9px 0;font-size:15px;align-items:start}
.upd .tm{color:var(--mut);font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:#8a9a94;margin-top:6px}.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}
.upd.now b{font-weight:800}
a.lnk{color:var(--ink);text-decoration:underline dotted;cursor:pointer}
.cd{background:#fcf0d4;color:#7a4d06;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;font-weight:700;display:none}
.empty{color:var(--mut);font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:12px}
.bar button,.bar a{flex:1;border-radius:18px;padding:16px 8px;font-weight:800;font-size:16px;text-align:center;text-decoration:none;border:2px solid var(--ink);background:#fff;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
.bar .call{background:var(--red);border-color:var(--red);color:#fff}
.bar .talking{background:var(--green);border-color:var(--ink);color:#fff}
.sub{display:flex;gap:10px;margin-top:12px}
.sub button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:14px;background:#e9ece8;color:var(--ink)}
.toast{position:fixed;left:16px;right:16px;bottom:110px;background:#16302a;color:#fff;border-radius:14px;padding:13px 16px;font-size:14px;display:none;z-index:30}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:40;flex-direction:column;justify-content:center;padding:14px}
.modal.on{display:flex}.modal img{width:100%;border-radius:14px}.modal p{color:#fff;text-align:center}
.modal button{background:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:15px}
</style>
</head>
<body>
<div class="hdr" id="hdr">
  <div class="l1"><span id="hL">&#9888; MONITORING</span><span id="hR"></span></div>
  <h1 id="hT">Connecting...</h1>
  <p id="hS"></p>
</div>

<div class="wrap">
  <div class="video">
    <span class="pill live off" id="live">LIVE</span><span class="pill clk" id="clk">--</span>
    <img id="vid" alt="">
    <div class="vmsg" id="vmsg">Waiting for video from main.py...</div>
    <span class="tag" id="vtag"></span>
  </div>

  <div class="voice" id="voice">&#128266; Your voice is playing in the room</div>

  <div class="card">
    <small>LIVE UPDATES</small>
    <div id="updates"><div class="empty">No updates yet.</div></div>
  </div>

  <div class="cd" id="cd"></div>

  <div class="sub">
    <button id="handled">Mark as handled</button>
    <button id="settings">Info</button>
  </div>
</div>

<div class="bar">
  <button id="talk">&#127908;<br>Hold to talk</button>
  <a class="call" id="call" href="tel:911">&#128222;<br>Call 911</a>
</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><img id="mImg" alt=""><p id="mTxt"></p><button id="mClose">Close</button></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var cfg={name:"Your family member",room:"Living room",address:"",phone:"911",countdown:120,push:false,talk:false};
  var events=[], st={alert:false,offset:0,srv:false,cam:false,text:""}, logs=[];
  var handled=JSON.parse(localStorage.getItem("fd.phone.handled")||"{}");
  var lastName=null, first=true, audio=null;

  function pad(n){return (n<10?"0":"")+n;}
  function hm(t){var d=new Date(t*1000),h=d.getHours();return (h%12||12)+":"+pad(d.getMinutes())+" "+(h>=12?"PM":"AM");}
  function full(t){return new Date(t*1000).toLocaleString();}
  function nowS(){return Date.now()/1000+st.offset;}
  function ago(t){var s=Math.max(0,Math.round(nowS()-t)); if(s<60) return s+" s ago"; if(s<3600) return Math.floor(s/60)+" min ago"; return Math.floor(s/3600)+" h ago";}
  function kind(k){return k==="prolonged_lying"?"Prolonged lying":"Fall";}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function latest(){return events.length?events[events.length-1]:null;}
  function log(t,c){logs.push({t:Date.now()/1000+st.offset,text:t,color:c||""}); if(logs.length>20) logs.shift();}
  function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none";},3500);}

  function applyCfg(){
    $("call").href="tel:"+cfg.phone; $("call").innerHTML="&#128222;<br>Call "+esc(cfg.phone);
  }
  fetch("/config.json").then(function(r){return r.json();}).then(function(c){cfg=Object.assign(cfg,c);applyCfg();render();}).catch(function(){});

  function beep(){
    try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();
      var o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=880;g.gain.value=.25;
      o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.6);}catch(e){}
  }
  function alarm(e){ if(navigator.vibrate) navigator.vibrate([400,150,400,150,600]); beep();
    if(window.Notification&&Notification.permission==="granted"){try{new Notification(cfg.name+" may have fallen",{body:full(e.t),icon:e.url});}catch(x){}} }

  function video(){
    var v=$("vid"); v.onload=function(){st.cam=true;$("vmsg").style.display="none";render();};
    v.onerror=function(){st.cam=false;$("vmsg").style.display="grid";render();setTimeout(video,3000);};
    v.src="/video?"+Date.now();
  }

  function poll(){
    fetch("/events.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
      var firstOk=!st.srv; st.srv=true; st.offset=d.now-Date.now()/1000;
      events=d.events||[]; var l=latest();
      if(l&&l.name!==lastName){ if(!first){alarm(l);log(kind(l.kind)+" detected in the "+cfg.room.toLowerCase(),"red");} lastName=l.name; }
      if(d.alert&&!st.alert) log("No movement since the fall","amber");
      st.alert=!!d.alert; st.text=d.alert_text||""; first=false;
      if(firstOk) log("Connected to the server");
      render();
    }).catch(function(){ st.srv=false; render(); });
  }

  function render(){
    var l=latest(); var active=st.alert&&l&&!handled[l.name];
    $("hdr").className="hdr"+(active?" red":""); $("theme").content=active?"#b3261e":"#1d5c4c";
    if(active){
      $("hL").innerHTML="&#9888; "+(l.kind==="prolonged_lying"?"PROLONGED LYING":"FALL DETECTED"); $("hR").textContent=ago(l.t);
      $("hT").textContent=cfg.name+" may have fallen"; $("hS").textContent=cfg.room+(cfg.address?" · "+cfg.address:"");
    } else {
      $("hL").innerHTML="&#128737; MONITORING"; $("hR").textContent=l?"Last event: "+ago(l.t):"";
      $("hT").textContent=st.srv?"Watching over "+cfg.name:"Lost connection to the server"; $("hS").textContent=cfg.room+(cfg.address?" · "+cfg.address:"");
    }
    var on=st.srv&&st.cam; $("live").classList.toggle("off",!on);
    var tg=$("vtag"); if(active){tg.style.display="block";tg.textContent=kind(l.kind)+" · "+hm(l.t);} else tg.style.display="none";

    var items=logs.map(function(x){return {t:x.t,html:esc(x.text),color:x.color};});
    events.slice(-6).forEach(function(e){items.push({t:e.t,html:'<a class="lnk" data-ev="'+esc(e.name)+'">'+kind(e.kind)+' detected in the '+esc(cfg.room.toLowerCase())+'</a>',color:"red"});});
    if(cfg.push&&l) items.push({t:l.t+1,html:"Alert sent to this phone",color:""});
    items.sort(function(a,b){return b.t-a.t;});
    if(active) items.unshift({t:nowS(),html:"Waiting for a response",color:"",now:true});
    $("updates").innerHTML=items.length?items.slice(0,7).map(function(x){
      return '<div class="upd'+(x.now?' now':'')+'"><span class="tm">'+(x.now?"Now":hm(x.t))+'</span><span class="dot '+x.color+'"></span><span>'+(x.now?"<b>"+x.html+"</b>":x.html)+'</span></div>';
    }).join(""):'<div class="empty">No updates yet.</div>';

    $("handled").style.display=l?"":"none"; $("handled").textContent=l&&handled[l.name]?"Unmark as handled":"Mark as handled";
    tickCd();
  }

  function tickCd(){
    var l=latest(), el=$("cd"); var active=st.alert&&l&&!handled[l.name]; var total=parseInt(cfg.countdown,10)||0;
    $("clk").textContent=(function(){var d=new Date();var h=d.getHours();return (h%12||12)+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+" "+(h>=12?"PM":"AM");})();
    if(!active||total<=0){el.style.display="none";return;}
    var left=Math.max(0,Math.round(total-(nowS()-l.t)));
    el.style.display="block";
    el.innerHTML="&#9201; "+(left>0?"Call "+esc(cfg.phone)+" in "+Math.floor(left/60)+":"+pad(left%60)+" if no one acts":"Time is up — call "+esc(cfg.phone)+" now");
  }
  setInterval(tickCd,500);

  document.addEventListener("click",function(e){var t=e.target.closest("[data-ev]");if(!t)return;
    var ev=events.filter(function(x){return x.name===t.getAttribute("data-ev");})[0]; if(!ev)return;
    $("mImg").src=ev.url; $("mTxt").textContent=kind(ev.kind)+" · "+full(ev.t); $("modal").classList.add("on");});
  $("mClose").onclick=function(){$("modal").classList.remove("on");};
  $("handled").onclick=function(){var l=latest();if(!l)return; if(handled[l.name]) delete handled[l.name]; else handled[l.name]=1; localStorage.setItem("fd.phone.handled",JSON.stringify(handled)); render();};
  $("settings").onclick=function(){
    if(window.Notification&&Notification.permission==="default") Notification.requestPermission();
    beep(); if(navigator.vibrate) navigator.vibrate(200);
    toast("Sound and vibration are on while this page is open. Name, address and emergency number are set with main.py options.");
  };

  var tb=$("talk");
  function talkDown(e){ e.preventDefault(); if(!cfg.talk){ toast("Two-way talk is not connected yet. Please call directly for now."); return; } tb.classList.add("talking"); $("voice").style.display="block"; }
  function talkUp(){ tb.classList.remove("talking"); $("voice").style.display="none"; }
  tb.addEventListener("pointerdown",talkDown); tb.addEventListener("pointerup",talkUp); tb.addEventListener("pointercancel",talkUp); tb.addEventListener("pointerleave",talkUp);
  if(location.hash==="#talk") setTimeout(function(){toast("Two-way talk is not connected yet. Please call directly.");},800);

  video(); poll(); setInterval(poll,2000);
})();
</script>
</body>
</html>
