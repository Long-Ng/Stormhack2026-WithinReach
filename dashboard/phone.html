<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e" id="theme">
<link rel="manifest" href="/manifest.json">
<title>Fall Alert</title>
<style>
:root{--red:#b3261e;--red-d:#8f1d17;--green:#1d5c4c;--ink:#16302a;--mut:#6b7a74;--bg:#f4f4f1;--amber:#c27c0e;
--pad:clamp(12px,3vw,24px);--gap:clamp(10px,1.8vw,16px);--r:clamp(18px,3vw,24px);--maxw:560px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(15px,.4vw + 13px,18px);-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
img{max-width:100%}
.hdr{background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 20px) 0 20px}
.hdr.red{background:var(--red)}
.inner{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.hdr .l1{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;font-weight:700;letter-spacing:.05em}
.hdr h1{margin:10px 0 4px;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1}
.hdr p{margin:0;opacity:.9;font-size:1rem}
.wrap{max-width:var(--maxw);margin:0 auto;padding:var(--gap) var(--pad)}
.cols{display:flex;flex-direction:column;gap:var(--gap)}
.video{position:relative;background:#1d2a27;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;width:100%}
.video img{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.pill{position:absolute;top:12px;background:rgba(0,0,0,.7);color:#fff;border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700}
.pill.live{left:12px}.pill.live:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4b3e;margin-right:6px}
.pill.live.off:before{background:#999}.pill.clk{right:12px}
.tag{position:absolute;left:12px;bottom:12px;background:#f6b83d;color:#3b2800;border-radius:8px;padding:4px 10px;font-size:.8rem;font-weight:800;display:none}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;color:#9fb1ab;font-size:.9rem;pointer-events:none;text-align:center;padding:10px}
.voice{display:none;background:var(--green);color:#fff;border-radius:99px;padding:13px 18px;font-size:.95rem}
.card{background:#fff;border-radius:var(--r);padding:clamp(14px,2.4vw,20px)}
.card small{display:block;color:var(--mut);font-weight:800;letter-spacing:.05em;font-size:.75rem;margin-bottom:8px}
.upd{display:grid;grid-template-columns:4rem 14px minmax(0,1fr);gap:10px;padding:9px 0;font-size:.95rem;align-items:start}
.upd .tm{color:var(--mut);font-size:.88rem}
.dot{width:10px;height:10px;border-radius:50%;background:#8a9a94;margin-top:6px}.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}
.upd.now b{font-weight:800}
a.lnk{color:var(--ink);text-decoration:underline dotted;cursor:pointer}
.cd{background:#fcf0d4;color:#7a4d06;border-radius:14px;padding:12px 14px;font-size:.9rem;font-weight:700;display:none}
.empty{color:var(--mut);font-size:.9rem}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 0 calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(transparent,var(--bg) 35%);z-index:10}
.bar .inner{display:flex;gap:12px}
.bar button,.bar a{flex:1;border-radius:18px;padding:14px 8px;font-weight:800;font-size:1rem;text-align:center;text-decoration:none;border:2px solid var(--ink);background:#fff;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;min-height:56px}
.bar .call{background:var(--red);border-color:var(--red);color:#fff}
.bar .talking{background:var(--green);border-color:var(--ink);color:#fff}
.sub{display:flex;gap:10px}
.sub button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:.9rem;background:#e9ece8;color:var(--ink);min-height:46px}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px));bottom:calc(110px + env(safe-area-inset-bottom));background:#16302a;color:#fff;border-radius:14px;padding:13px 16px;font-size:.9rem;display:none;z-index:30}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;z-index:40;flex-direction:column;justify-content:center;align-items:center;padding:14px;gap:10px}
.modal.on{display:flex}.modal img{width:min(900px,100%);max-height:72dvh;object-fit:contain;border-radius:14px}.modal p{color:#fff;text-align:center;margin:0}
.modal button{background:#fff;border:0;border-radius:12px;padding:13px 24px;font-weight:800;font-size:1rem}

/* Tablet (>= 768px): wider page, video left and updates right */
@media (min-width:768px){
  :root{--maxw:900px}
  .cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .cols .col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
}
/* Laptop / desktop (>= 1200px) */
@media (min-width:1200px){
  :root{--maxw:1120px}
  .cols{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
}
/* Phone in landscape or very short screen */
@media (orientation:landscape) and (max-height:520px){
  :root{--maxw:980px}
  .hdr{padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:10px}
  .hdr h1{font-size:1.4rem;margin:4px 0 2px}
  .cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
  .cols .col{display:flex;flex-direction:column;gap:var(--gap);min-width:0}
  .video{aspect-ratio:16/10}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .bar button,.bar a{min-height:46px;padding:8px}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="hdr" id="hdr"><div class="inner">
  <div class="l1"><span id="hL">&#9888; ĐANG THEO DÕI</span><span id="hR"></span></div>
  <h1 id="hT">Đang kết nối...</h1>
  <p id="hS"></p>
</div></div>

<div class="wrap"><div class="cols">
  <div class="col">
    <div class="video">
      <span class="pill live off" id="live">LIVE</span><span class="pill clk" id="clk">--</span>
      <img id="vid" alt="">
      <div class="vmsg" id="vmsg">Đang chờ video từ main.py...</div>
      <span class="tag" id="vtag"></span>
    </div>
    <div class="voice" id="voice">&#128266; Giọng nói của bạn đang phát trong phòng</div>
  </div>
  <div class="col">
    <div class="card">
      <small>CẬP NHẬT TRỰC TIẾP</small>
      <div id="updates"><div class="empty">Chưa có cập nhật.</div></div>
    </div>
    <div class="cd" id="cd"></div>
    <div class="sub">
      <button id="handled">Đánh dấu đã xử lý</button>
      <button id="settings">Thông tin</button>
    </div>
  </div>
</div></div>

<div class="bar"><div class="inner">
  <button id="talk">&#127908;<br>Giữ để nói</button>
  <a class="call" id="call" href="tel:911">&#128222;<br>Gọi 911</a>
</div></div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><img id="mImg" alt=""><p id="mTxt"></p><button id="mClose">Đóng</button></div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var cfg={name:"Người thân",room:"Phòng khách",address:"",phone:"911",countdown:120,push:false,talk:false};
  var events=[], st={alert:false,offset:0,srv:false,cam:false,text:""}, logs=[];
  var handled=JSON.parse(localStorage.getItem("fd.phone.handled")||"{}");
  var lastName=null, first=true, audio=null;

  // screen size detection -> body[data-size]: compact | medium | expanded
  function detect(){
    var w=window.innerWidth;
    document.body.dataset.size = w<768 ? "compact" : (w<1200 ? "medium" : "expanded");
    document.body.dataset.orient = w>window.innerHeight ? "landscape" : "portrait";
  }
  window.addEventListener("resize",detect); window.addEventListener("orientationchange",detect); detect();

  function pad(n){return (n<10?"0":"")+n;}
  function hm(t){var d=new Date(t*1000),h=d.getHours();return (h%12||12)+":"+pad(d.getMinutes())+" "+(h>=12?"PM":"AM");}
  function full(t){return new Date(t*1000).toLocaleString("vi-VN");}
  function nowS(){return Date.now()/1000+st.offset;}
  function ago(t){var s=Math.max(0,Math.round(nowS()-t)); if(s<60) return s+" giây trước"; if(s<3600) return Math.floor(s/60)+" phút trước"; return Math.floor(s/3600)+" giờ trước";}
  function kind(k){return k==="prolonged_lying"?"Nằm bất động lâu":"Té ngã";}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function latest(){return events.length?events[events.length-1]:null;}
  function log(t,c){logs.push({t:Date.now()/1000+st.offset,text:t,color:c||""}); if(logs.length>20) logs.shift();}
  function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(function(){t.style.display="none";},3500);}

  function applyCfg(){ $("call").href="tel:"+cfg.phone; $("call").innerHTML="&#128222;<br>Gọi "+esc(cfg.phone); }
  fetch("/config.json").then(function(r){return r.json();}).then(function(c){cfg=Object.assign(cfg,c);applyCfg();render();}).catch(function(){});

  function beep(){
    try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();
      var o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=880;g.gain.value=.25;
      o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.6);}catch(e){}
  }
  function alarm(e){ if(navigator.vibrate) navigator.vibrate([400,150,400,150,600]); beep();
    if(window.Notification&&Notification.permission==="granted"){try{new Notification(cfg.name+" có thể đã ngã",{body:full(e.t),icon:e.url});}catch(x){}} }

  function video(){
    var v=$("vid"); v.onload=function(){st.cam=true;$("vmsg").style.display="none";render();};
    v.onerror=function(){st.cam=false;$("vmsg").style.display="grid";render();setTimeout(video,3000);};
    v.src="/video?"+Date.now();
  }

  function poll(){
    fetch("/events.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
      var firstOk=!st.srv; st.srv=true; st.offset=d.now-Date.now()/1000;
      events=d.events||[]; var l=latest();
      if(l&&l.name!==lastName){ if(!first){alarm(l);log("Phát hiện "+kind(l.kind).toLowerCase()+" trong "+cfg.room,"red");} lastName=l.name; }
      if(d.alert&&!st.alert) log("Chưa thấy chuyển động kể từ lúc ngã","amber");
      st.alert=!!d.alert; st.text=d.alert_text||""; first=false;
      if(firstOk) log("Đã kết nối máy chủ");
      render();
    }).catch(function(){ st.srv=false; render(); });
  }

  function render(){
    var l=latest(); var active=st.alert&&l&&!handled[l.name];
    $("hdr").className="hdr"+(active?" red":""); $("theme").content=active?"#b3261e":"#1d5c4c";
    if(active){
      $("hL").innerHTML="&#9888; "+(l.kind==="prolonged_lying"?"BẤT ĐỘNG LÂU":"FALL DETECTED"); $("hR").textContent=ago(l.t);
      $("hT").textContent=cfg.name+" có thể đã ngã"; $("hS").textContent=cfg.room+(cfg.address?" · "+cfg.address:"");
    } else {
      $("hL").innerHTML="&#128737; ĐANG THEO DÕI"; $("hR").textContent=l?"Lần cuối: "+ago(l.t):"";
      $("hT").textContent=st.srv?"Đang theo dõi "+cfg.name:"Mất kết nối máy chủ"; $("hS").textContent=cfg.room+(cfg.address?" · "+cfg.address:"");
    }
    var on=st.srv&&st.cam; $("live").classList.toggle("off",!on);
    var tg=$("vtag"); if(active){tg.style.display="block";tg.textContent=kind(l.kind)+" · "+hm(l.t);} else tg.style.display="none";

    var items=logs.map(function(x){return {t:x.t,html:esc(x.text),color:x.color};});
    events.slice(-6).forEach(function(e){items.push({t:e.t,html:'<a class="lnk" data-ev="'+esc(e.name)+'">'+kind(e.kind)+' phát hiện trong '+esc(cfg.room)+'</a>',color:"red"});});
    if(cfg.push&&l) items.push({t:l.t+1,html:"Đã gửi cảnh báo tới điện thoại này",color:""});
    items.sort(function(a,b){return b.t-a.t;});
    if(active) items.unshift({t:nowS(),html:"Đang chờ người thân phản hồi",color:"",now:true});
    $("updates").innerHTML=items.length?items.slice(0,7).map(function(x){
      return '<div class="upd'+(x.now?' now':'')+'"><span class="tm">'+(x.now?"Bây giờ":hm(x.t))+'</span><span class="dot '+x.color+'"></span><span>'+(x.now?"<b>"+x.html+"</b>":x.html)+'</span></div>';
    }).join(""):'<div class="empty">Chưa có cập nhật.</div>';

    $("handled").style.display=l?"":"none"; $("handled").textContent=l&&handled[l.name]?"Bỏ đánh dấu đã xử lý":"Đánh dấu đã xử lý";
    tickCd();
  }

  function tickCd(){
    var l=latest(), el=$("cd"); var active=st.alert&&l&&!handled[l.name]; var total=parseInt(cfg.countdown,10)||0;
    $("clk").textContent=(function(){var d=new Date();var h=d.getHours();return (h%12||12)+":"+pad(d.getMinutes())+":"+pad(d.getSeconds())+" "+(h>=12?"PM":"AM");})();
    if(!active||total<=0){el.style.display="none";return;}
    var left=Math.max(0,Math.round(total-(nowS()-l.t)));
    el.style.display="block";
    el.innerHTML="&#9201; "+(left>0?"Gợi ý gọi "+esc(cfg.phone)+" sau "+Math.floor(left/60)+":"+pad(left%60)+" nếu chưa ai xử lý":"Đã hết thời gian chờ — hãy gọi "+esc(cfg.phone)+" ngay");
  }
  setInterval(tickCd,500);

  document.addEventListener("click",function(e){var t=e.target.closest("[data-ev]");if(!t)return;
    var ev=events.filter(function(x){return x.name===t.getAttribute("data-ev");})[0]; if(!ev)return;
    $("mImg").src=ev.url; $("mTxt").textContent=kind(ev.kind)+" · "+full(ev.t); $("modal").classList.add("on");});
  $("mClose").onclick=function(){$("modal").classList.remove("on");};
  $("handled").onclick=function(){var l=latest();if(!l)return; if(handled[l.name]) delete handled[l.name]; else handled[l.name]=1; localStorage.setItem("fd.phone.handled",JSON.stringify(handled)); render();};
  $("settings").onclick=function(){
    if(window.Notification&&Notification.permission==="default") Notification.requestPermission();
    beep(); if(navigator.vibrate) navigator.vibrate(200);
    toast("Âm báo và rung đã bật khi trang đang mở. Tên, địa chỉ, số khẩn cấp đặt bằng tham số khi chạy main.py.");
  };

  var tb=$("talk");
  function talkDown(e){ e.preventDefault(); if(!cfg.talk){ toast("Tính năng nói chuyện hai chiều chưa được kết nối. Hiện tại hãy gọi điện trực tiếp."); return; } tb.classList.add("talking"); $("voice").style.display="block"; }
  function talkUp(){ tb.classList.remove("talking"); $("voice").style.display="none"; }
  tb.addEventListener("pointerdown",talkDown); tb.addEventListener("pointerup",talkUp); tb.addEventListener("pointercancel",talkUp); tb.addEventListener("pointerleave",talkUp);
  if(location.hash==="#talk") setTimeout(function(){toast("Tính năng nói chuyện hai chiều chưa được kết nối. Hãy gọi điện trực tiếp.");},800);

  video(); poll(); setInterval(poll,2000);
})();
</script>
</body>
</html>
