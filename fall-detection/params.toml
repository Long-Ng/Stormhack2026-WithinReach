# Tuning parameters. Each value overrides the default in config.py.
# Delete a line to fall back to the default. Restart main.py after editing.
# Section headers are only for grouping; names must match config.py exactly.

[pose]
# model_path = "models/pose_landmarker_lite.task"   # lighter model if FPS is low
min_pose_detection_confidence = 0.5
min_pose_presence_confidence = 0.5
min_tracking_confidence = 0.5

[capture]
camera_index = 0             # used when no DroidCam phone is streaming
prefer_droidcam = true       # with no --source, use a connected DroidCam phone if there is one
droidcam_probe_s = 3.0       # seconds to wait for DroidCam to send a real picture at startup
placeholder_max_std = 5.0    # frames flatter than this are DroidCam's "no phone" screen
droidcam_live_frames = 3     # distinct real frames needed before DroidCam counts as streaming
frame_width = 640
frame_height = 480

[features]
min_visibility = 0.5      # landmark visibility cutoff (0-1)
motion_window_s = 1.0     # motion = net movement over this window; pose wobble cancels out
ema_alpha = 0.4           # smoothing for angle / hip_vel / motion; lower = smoother, 1.0 = off
vel_window_s = 0.5        # window for peak hip velocity
ref_upright_angle = 20.0  # torso_ref only learns from frames more upright than this
torso_ref_frames = 30     # rolling median length for torso_ref

[detector]
# Fast descent: UPRIGHT -> FALLING
fall_vel = 1.5            # torso lengths/s downward. Real falls ~2.5-3.5, sitting ~0.8
fall_window_s = 1.5       # time allowed from fast descent to lying

# "Down" = (torso_angle > lying_angle OR bbox_aspect > lying_aspect) AND hip_height < low_hip
lying_angle = 60.0        # torso angle: 0 upright, 90 horizontal, 180 upside down
lying_aspect = 1.2        # bbox width / height
low_hip = 0.6             # hip height above ankles, in torso lengths

# Stillness on the ground: ON_GROUND -> FALL_CONFIRMED
still_motion = 0.3        # torso lengths/s; raise if small jitter keeps resetting the timer
confirm_s = 3.0           # seconds of stillness before the fall is confirmed
still_grace_s = 0.5       # movement shorter than this pauses the timer instead of resetting it

# Recovery and pose loss
ground_hold_angle = 30.0  # once ON_GROUND, a torso tilted at least this much still counts as down
                          # (someone lying diagonally toward a high camera can look only ~30 deg tilted)
upright_angle = 30.0      # torso angle counted as upright (upside down is not upright)
recover_s = 1.0           # seconds upright to go back to UPRIGHT
lost_grace_s = 1.0        # pose lost while down: hold this long, then count as still
slow_fall_s = 15.0        # lying this long without a fast descent -> prolonged_lying

[cover_reset]
# Hold a hand over the lens to reset detection. The overlay's "lum"/"tex"
# readout (top right) shows the live values; covered must be below both.
cover_reset = true
cover_reset_s = 3.0          # seconds covered before resetting
cover_max_brightness = 40.0  # mean pixel value 0-255
cover_max_std = 12.0         # texture; a covered lens is a flat blur

[imu]
# Phone accelerometer via Phyphox: experiment "Acceleration (without g)",
# menu > Allow remote access. Test with: python imu.py
# Set imu_url = "" to run camera only. Ignored when replaying a video file.
imu_url = ""
imu_poll_s = 0.05
imu_timeout_s = 2.0
imu_impact_ms2 = 20.0     # m/s^2 above rest (~2 g); a hard fall is usually higher
imu_refractory_s = 1.0    # ignore further spikes this long after an impact
imu_suspect_s = 10.0      # screens show "Fall suspected" this long after a phone shock
imu_match_s = 2.0         # impact within this of the camera's fall -> confirm immediately
imu_hold_s = 10.0         # forget an unmatched impact after this long
imu_still_ms2 = 1.5       # phone below this counts as still
imu_still_s = 3.0         # impact, then phone still this long, person unseen or down -> sensor_fall

[events]
events_dir = "events"     # events.jsonl, snapshot .jpg and clip .mp4 files, relative to this file
# Each event saves an .mp4: clip_pre_s before the confirmation, then everything after
# until the person has been back up for clip_tail_s (or clip_max_after_s has passed).
clip_pre_s = 30.0
clip_tail_s = 10.0
clip_max_after_s = 300.0
clip_max_width = 640      # pixels; file size grows with width^2 x fps (640 @ 15 fps ~ 25 MB/min)
clip_max_fps = 15.0

[alerts]
# Phone alerts through ntfy (https://ntfy.sh). Put the private values in
# params.local.toml next to this file (gitignored), e.g.:
#   ntfy_person_topic  = "fall-person-<random>"
#   ntfy_monitor_topic = "fall-monitor-<random>"
#   call_number   = "+1555..."   # a teammate while testing, NOT 911
#   person_number = "+1555..."
ntfy_server = "https://ntfy.sh"
ntfy_attach_snapshot = true   # monitor notification shows the snapshot
reply_timeout_s = 30.0        # person has this long to answer before the monitor is alerted
room_name = "Living room"
public_url = ""               # empty = http://<this PC's Wi-Fi IP>:<port>
# Phones: scan the QR codes printed at startup (or open /connect on the laptop), or type
# http://within-reach.local:<port>/monitor. With --port 80 the ":<port>" can be left out.
mdns_name = "within-reach"   # "" turns the .local name off

[gemini]
# Gemini describes each confirmed fall (type, position, movement) and the monitor gets
# fixed guidance for it. Then Gemini checks every gemini_update_s while the incident is
# open. Camera frames are sent to Google. Off unless gemini_api_key is set in
# params.local.toml (or the GEMINI_API_KEY environment variable).
gemini_model = "gemini-3.8-flash"
gemini_fallback_model = "gemini-3.5-flash-lite"   # used when the main model is overloaded or limited
# Free tier: 3.8 Flash allows 5 requests a minute and 20 a day, Flash Lite 15 and 500.
# So gemini_model only does the first look at each fall; the per-minute checks and the
# room scans use gemini_update_model. A rate-limited model is skipped until Google says.
gemini_update_model = "gemini-3.5-flash-lite"
gemini_video_fps = 5.0       # enough to see how fast someone went down
# Demo backup: Gemini's answers come from a preloaded scenario (fake_gemini.py) instead
# of the API: no key, no network, no rate limits. Everything else runs as usual. The
# dashboard's Fast Forward button makes the per-minute checks come every 2 s.
gemini_fake = true
demo_fast_speed = 30.0
gemini_update_s = 60.0       # how often Gemini checks on the person
gemini_notify_s = 300.0      # the monitor gets the latest analysis at most this often
gemini_notify_urgent_now = true  # except: turning urgent ("call 911") is sent at once
gemini_max_minutes = 60.0    # stop checking after this long

[rest_zones]
# Lying inside a rest zone (bed, sofa, armchair, recliner) is resting, not a fall:
# the shoulders and hips must both be inside, so lying on the floor beside the bed
# still counts. With a Gemini key, the room is scanned once it is empty, and again
# when it looks different (furniture moved) for scene_change_s. Edit zones_file to add
# zones by hand: {"label": "bed", "box": [x0, y0, x1, y1], "source": "manual"}, with
# the box in fractions of the frame; manual zones are never replaced by a scan.
rest_zones = true
zones_file = "data/zones.json"
scene_empty_s = 5.0
scene_change_frac = 0.1      # moving a sofa changes ~20% of the picture; lighting ~0%
scene_change_s = 20.0
scene_min_interval_s = 600.0
emergency_number = "911"     # only used in guidance text; nothing is dialled

[skeleton]
privacy_view = false         # start in Privacy view (outline only, no camera picture); switchable on the phone page
# Smoothing of the DRAWN skeleton (overlay and privacy view). Detection uses raw landmarks.
# Measured on the benchmark clips: wobble 1.40 -> 0.45 px/frame, lag ~3 px when moving fast.
skel_min_cutoff = 0.3        # lower = calmer when still, more lag
skel_beta = 0.12             # higher = less lag when moving, a bit more wobble
skel_d_cutoff = 0.3
skel_body_speed = true       # judge speed from the whole body, so wobble does not loosen the filter
skel_hide_visibility = 0.3   # a shown joint hides only below this (no blinking)
skel_hold_s = 0.5            # keep the last skeleton this long when the pose drops out

[display]
fps_smoothing = 0.9
