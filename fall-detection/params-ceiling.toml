# Ceiling / corner security camera profile (looking down at the room).
# Tuned on CAUCAFall (10 subjects x 10 activities, last frame held 5 s):
#   defaults: 34/50 falls, 1/50 false alarms -> this file: 43/50 falls, 1/50 false alarms
#   chosen on subjects 1-5, checked on unseen subjects 6-10 (18 -> 21 of 25, 0 false alarms)
# Use: python main.py --source rtsp://... --params params-ceiling.toml
# Not validated for a table-height camera; keep params.toml for that until tested.

# Tuning parameters. Each value overrides the default in config.py.
# Delete a line to fall back to the default. Restart main.py after editing.
# Section headers are only for grouping; names must match config.py exactly.

[pose]
# model_path = "models/pose_landmarker_lite.task"   # lighter model if FPS is low
min_pose_detection_confidence = 0.5
min_pose_presence_confidence = 0.5
min_tracking_confidence = 0.5

[capture]
camera_index = 0             # used when no DroidCam phone is streaming
prefer_droidcam = true       # with no --source, use a connected DroidCam phone if there is one
droidcam_probe_s = 3.0       # seconds to wait for DroidCam to send a real picture at startup
placeholder_max_std = 5.0    # frames flatter than this are DroidCam's "no phone" screen
droidcam_live_frames = 3     # distinct real frames needed before DroidCam counts as streaming
frame_width = 640
frame_height = 480

[features]
min_visibility = 0.5      # landmark visibility cutoff (0-1)
motion_window_s = 1.0     # motion = net movement over this window; pose wobble cancels out
ema_alpha = 0.4           # smoothing for angle / hip_vel / motion; lower = smoother, 1.0 = off
vel_window_s = 0.5        # window for peak hip velocity
ref_upright_angle = 20.0  # torso_ref only learns from frames more upright than this
torso_ref_frames = 30     # rolling median length for torso_ref

[detector]
# Fast descent: UPRIGHT -> FALLING
fall_vel = 1.5            # torso lengths/s downward. Real falls ~2.5-3.5, sitting ~0.8
fall_window_s = 2.0       # ceiling: falls take longer to look "down" from above (default 1.5)

# "Down" = (torso_angle > lying_angle OR bbox_aspect > lying_aspect) AND hip_height < low_hip
lying_angle = 60.0        # torso angle: 0 upright, 90 horizontal, 180 upside down
lying_aspect = 0.9        # ceiling: lying bodies look less wide from above (default 1.2)
low_hip = 1.0             # ceiling: perspective inflates hip height on the floor (default 0.6)

# Stillness on the ground: ON_GROUND -> FALL_CONFIRMED
still_motion = 0.3        # torso lengths/s; raise if small jitter keeps resetting the timer
confirm_s = 3.0           # seconds of stillness before the fall is confirmed
still_grace_s = 0.5       # movement shorter than this pauses the timer instead of resetting it

# Recovery and pose loss
ground_hold_angle = 30.0  # once ON_GROUND, a torso tilted at least this much still counts as down
upright_angle = 30.0      # torso angle counted as upright (upside down is not upright)
recover_s = 1.0           # seconds upright to go back to UPRIGHT
lost_grace_s = 1.0        # pose lost while down: hold this long, then count as still
slow_fall_s = 15.0        # lying this long without a fast descent -> prolonged_lying

[cover_reset]
# Hold a hand over the lens to reset detection. The overlay's "lum"/"tex"
# readout (top right) shows the live values; covered must be below both.
cover_reset = true
cover_reset_s = 3.0          # seconds covered before resetting
cover_max_brightness = 40.0  # mean pixel value 0-255
cover_max_std = 12.0         # texture; a covered lens is a flat blur

[events]
events_dir = "events"     # events.jsonl, snapshot .jpg and clip .mp4 files, relative to this file
# Each event saves an .mp4: clip_pre_s before the confirmation, then everything after
# until the person has been back up for clip_tail_s (or clip_max_after_s has passed).
clip_pre_s = 30.0
clip_tail_s = 10.0
clip_max_after_s = 300.0
clip_max_width = 640      # pixels; file size grows with width^2 x fps (640 @ 15 fps ~ 25 MB/min)
clip_max_fps = 15.0

[display]
fps_smoothing = 0.9
